site_name: pyscarcopula
site_url: https://AANovokhatskiy.github.io/pyscarcopula
site_description: Python library for bivariate, multivariate, vine, and stochastic copula models
repo_url: https://github.com/AANovokhatskiy/pyscarcopula
repo_name: AANovokhatskiy/pyscarcopula

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy

markdown_extensions:
  - pymdownx.highlight:
      line_spans: false
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Choosing a Model: getting-started/choosing-a-model.md
  - User Guide:
    - Models:
      - Bivariate Copulas: guide/bivariate.md
      - Multivariate Models: guide/multivariate_models.md
      - Factor Models: guide/factor-models.md
      - Vine Copulas: guide/vine.md
    - Fitting and Prediction:
      - Estimation Methods: guide/estimation-methods.md
      - Prediction Semantics: guide/prediction-semantics.md
      - R-vine Conditioning: guide/rvine-conditioning.md
    - Mathematical Reference:
      - Mathematical Contracts: guide/mathematical-contracts.md
      - Parameter Transforms: guide/transforms.md
  - Performance and Scaling:
    - Performance Tuning: guide/performance.md
    - CPU Parallelism: guide/parallelism.md
  - Numerical Reference:
    - Numerical Backends: guide/numerical-backends.md
    - Optimizer Controls: reference/optimizers.md
    - SCAR OU Numerics: reference/scar-ou.md
    - SCAR Jacobi Numerics: reference/scar-jacobi.md
    - Student Quantiles: reference/student-quantiles.md
    - Multivariate Numerics: reference/multivariate-numerics.md
    - Vine Numerics: reference/vine-numerics.md
  - Developer Guide:
    - Developer Architecture: guide/architecture.md
    - Validation:
      - Conditional Sampling CI: guide/conditional-sampling-validation.md
  - API Reference:
    - Core Copulas and Fitting: api/copulas.md
    - Multivariate and Factor Models: api/multivariate_models.md
    - Static Gaussian and Student: api/static-models.md
    - Factor Operators: api/factor.md
    - Equicorrelation Gaussian: api/equicorrelation.md
    - Stochastic Student: api/stochastic-student.md
    - Configuration and Results: api/configuration.md
    - Vines and Prediction: api/vine.md
    - Diagnostics: api/diagnostics.md
    - Persistence: api/persistence.md
    - Contrib Extensions: api/contrib.md
