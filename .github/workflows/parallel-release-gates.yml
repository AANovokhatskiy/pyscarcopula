name: Parallel release gates

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-py310
            os: ubuntu-latest
            python: "3.10"
            cc: gcc
            cxx: g++
            cpp_compiler: ""
          - name: linux-gcc-py314
            os: ubuntu-latest
            python: "3.14"
            cc: gcc
            cxx: g++
            cpp_compiler: ""
          - name: linux-clang-py312
            os: ubuntu-latest
            python: "3.12"
            cc: clang
            cxx: clang++
            cpp_compiler: ""
          - name: windows-msvc-py312
            os: windows-latest
            python: "3.12"
            cc: ""
            cxx: ""
            cpp_compiler: ""
          - name: windows-mingw64-py312
            os: windows-latest
            python: "3.12"
            cc: gcc
            cxx: g++
            cpp_compiler: mingw32
          - name: macos-arm64-clang-py312
            os: macos-14
            python: "3.12"
            cc: clang
            cxx: clang++
            cpp_compiler: ""

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install MinGW-w64 toolchain
        if: matrix.cpp_compiler == 'mingw32'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Expose MinGW-w64 to setuptools
        if: matrix.cpp_compiler == 'mingw32'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install build and test dependencies
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYSCA_CPP_COMPILER: ${{ matrix.cpp_compiler }}
          PYSCA_CPP_STRICT: "1"
        run: >-
          python -m pip install --upgrade pip build "setuptools>=68.0" wheel
          "pybind11>=2.13"
          ".[test]"

      - name: Verify Python-free C++ build boundary
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYSCA_CPP_COMPILER: ${{ matrix.cpp_compiler }}
          PYSCA_CPP_STRICT: "1"
        run: |
          python tools/check_cpp_architecture.py
          python tools/build_cpp_tests.py --force -j 8

      - name: Run accuracy and config-preservation gates
        run: >-
          python -m pytest -n 8 -q
          tests/test_cpp_architecture.py
          tests/test_cpp_refactor_contracts.py

      - name: Build strict wheel
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYSCA_CPP_COMPILER: ${{ matrix.cpp_compiler }}
          PYSCA_CPP_STRICT: "1"
        run: >-
          python -m pip wheel . --no-deps --no-build-isolation
          --wheel-dir wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip uninstall -y pyscarcopula
          python -m pip install --force-reinstall wheelhouse/*.whl

      - name: Smoke-test wheel outside source tree
        working-directory: ${{ runner.temp }}
        run: python -m pyscarcopula._native.smoke

      - name: Audit binary dependencies
        working-directory: ${{ runner.temp }}
        run: >-
          python "${{ github.workspace }}/tools/native_dependency_audit.py"
          --output
          "${{ github.workspace }}/build/release/${{ matrix.name }}-dependencies.json"

      - name: Run full non-benchmark suite against wheel
        working-directory: ${{ runner.temp }}
        env:
          PYTHONFAULTHANDLER: "1"
        run: >-
          python -X faulthandler -m pytest "${{ github.workspace }}/tests"
          --import-mode=importlib
          -m "not benchmark"
          -k "not test_documented_python_blocks_compile_import_and_bind_public_calls"
          -vv -s --tb=long
          -o faulthandler_timeout=120

      - name: Write platform metadata
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYSCA_CPP_COMPILER: ${{ matrix.cpp_compiler }}
        run: >-
          python tools/write_release_metadata.py
          --configuration "${{ matrix.name }}"
          --wheel-dir wheelhouse
          --output "build/release/${{ matrix.name }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: parallel-gate-${{ matrix.name }}
          path: |
            build/release/*.json
            wheelhouse/*.whl

  asan-ubsan:
    name: Linux Clang ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sanitizer build
        env:
          CC: clang
          CXX: clang++
          PYSCA_CPP_SANITIZE: "1"
          PYSCA_CPP_STRICT: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Python-free ASan and UBSan executable
        env:
          CC: clang
          CXX: clang++
          PYSCA_CPP_STRICT: "1"
        run: >-
          python tools/build_cpp_tests.py --force -j 8
          --sanitize address-undefined
          --build-dir build/cpp-tests-asan-ubsan
      - name: Run native parallel sanitizer suite
        env:
          ASAN_OPTIONS: >-
            detect_leaks=0:halt_on_error=1:abort_on_error=1:
            strict_string_checks=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          PYTHONFAULTHANDLER: "1"
        run: |
          asan_path="$(clang++ -print-file-name=libclang_rt.asan-x86_64.so)"
          export LD_PRELOAD="${asan_path}"
          python -m pytest -vv -s --tb=long \
            tests/test_parallel_runtime.py \
            tests/test_multivariate_parallelization_baselines.py \
            tests/test_static_parallelization.py \
            tests/test_sampling_parallelization.py \
            tests/test_external_parallel_fit.py \
            tests/test_equicorr_prepared.py \
            tests/test_linalg_backend.py \
            tests/test_native_jacobi_domain.py \
            tests/test_native_jacobi_transition.py \
            tests/test_native_jacobi_evaluator.py \
            tests/test_native_jacobi_sampling.py \
            tests/test_native_jacobi_operations.py \
            -m "not benchmark and not sanitizer_numerical"
      - name: Write sanitizer metadata
        env:
          CC: clang
          CXX: clang++
        run: >-
          python tools/write_release_metadata.py
          --configuration linux-clang-asan-ubsan
          --output build/release/linux-clang-asan-ubsan.json
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-gate-asan-ubsan
          path: build/release/*.json

  tsan:
    name: Linux GCC ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ThreadSanitizer build
        env:
          CC: gcc
          CXX: g++
          PYSCA_CPP_THREAD_SANITIZE: "1"
          PYSCA_CPP_STRICT: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Python-free ThreadSanitizer executable
        env:
          CC: gcc
          CXX: g++
          PYSCA_CPP_STRICT: "1"
          TSAN_OPTIONS: >-
            halt_on_error=1:abort_on_error=1:
            second_deadlock_stack=1:history_size=7
        run: >-
          python tools/build_cpp_tests.py --force -j 8
          --sanitize thread
          --build-dir build/cpp-tests-tsan
      - name: Run parallel race suite
        env:
          TSAN_OPTIONS: >-
            halt_on_error=1:abort_on_error=1:
            second_deadlock_stack=1:history_size=7
          PYTHONFAULTHANDLER: "1"
        run: |
          tsan_path="$(g++ -print-file-name=libtsan.so)"
          export LD_PRELOAD="${tsan_path}"
          python -m pytest -vv -s --tb=long \
            tests/test_parallel_runtime.py \
            tests/test_multivariate_parallelization_baselines.py \
            tests/test_static_parallelization.py \
            tests/test_sampling_parallelization.py \
            tests/test_external_parallel_fit.py \
            tests/test_equicorr_prepared.py \
            tests/test_native_jacobi_evaluator.py \
            tests/test_native_jacobi_sampling.py \
            -m "not benchmark and not sanitizer_numerical and not tsan_incompatible"
      - name: Write sanitizer metadata
        env:
          CC: gcc
          CXX: g++
        run: >-
          python tools/write_release_metadata.py
          --configuration linux-gcc-tsan
          --output build/release/linux-gcc-tsan.json
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-gate-tsan
          path: build/release/*.json

  unix-lifecycle-memory:
    name: Unix lifecycle and memory stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Build CI-only allocation probe
        run: |
          mkdir -p build/release
          cc -shared -fPIC -O2 tools/allocation_probe.c \
            -o build/libpysca_alloc_probe.so
      - name: Run lifecycle, allocator and RSS gates
        env:
          PYSCA_RELEASE_STRESS_CYCLES: "100"
          PYSCA_ALLOCATION_PROBE: ${{ github.workspace }}/build/libpysca_alloc_probe.so
          PYSCA_RELEASE_METRICS_OUTPUT: ${{ github.workspace }}/build/release/linux-lifecycle-memory-metrics.json
          LD_PRELOAD: ${{ github.workspace }}/build/libpysca_alloc_probe.so
        run: |
          python -m pytest -vv -s --tb=long --run-validation \
            tests/test_parallel_release_gates.py \
            tests/test_parallel_runtime.py
      - name: Write lifecycle metadata
        run: >-
          python tools/write_release_metadata.py
          --configuration linux-lifecycle-memory
          --output build/release/linux-lifecycle-memory.json
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-gate-lifecycle-memory
          path: build/release/*.json

  subinterpreters:
    name: Embedded subinterpreter rejection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - env:
          PYSCA_RELEASE_METRICS_OUTPUT: ${{ github.workspace }}/build/release/subinterpreter-metrics.json
        run: >-
          python -m pytest -vv --run-validation
          tests/test_parallel_release_gates.py::test_subinterpreter_contract_is_immediate_rejection
      - name: Write subinterpreter metadata
        run: >-
          python tools/write_release_metadata.py
          --configuration subinterpreter-rejection
          --output build/release/subinterpreter-rejection.json
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-gate-subinterpreters
          path: build/release/*.json

  report:
    name: Aggregate validation report
    if: always()
    needs:
      - platform
      - asan-ubsan
      - tsan
      - unix-lifecycle-memory
      - subinterpreters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: parallel-gate-*
          path: build/release-artifacts
      - name: Reject incomplete gate matrix
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          ASAN_RESULT: ${{ needs['asan-ubsan'].result }}
          TSAN_RESULT: ${{ needs.tsan.result }}
          LIFECYCLE_RESULT: ${{ needs['unix-lifecycle-memory'].result }}
          SUBINTERPRETER_RESULT: ${{ needs.subinterpreters.result }}
        run: |
          python - <<'PY'
          import os
          results = {
              name: os.environ[name]
              for name in (
                  "PLATFORM_RESULT",
                  "ASAN_RESULT",
                  "TSAN_RESULT",
                  "LIFECYCLE_RESULT",
                  "SUBINTERPRETER_RESULT",
              )
          }
          print(results)
          if set(results.values()) != {"success"}:
              raise SystemExit("release-gate matrix is incomplete or failed")
          PY
      - name: Aggregate reports
        run: >-
          python tools/aggregate_release_validation.py
          --artifacts build/release-artifacts
          --json-output build/release-validation.json
          --markdown-output build/release-validation.md
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-release-validation
          path: |
            build/release-validation.json
            build/release-validation.md
