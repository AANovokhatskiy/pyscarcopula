name: Conditional sampling

on:
  pull_request:
    paths:
      - ".github/workflows/conditional-sampling.yml"
      - "pyscarcopula/**"
      - "tests/conditional/**"
      - "tests/conftest.py"
      - "tools/benchmark_conditional_sampling.py"
      - "tools/write_release_metadata.py"
      - "pyproject.toml"
      - "tools/run_in_workspace.py"
      - "setup.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/conditional-sampling.yml"
      - "pyscarcopula/**"
      - "tests/conditional/**"
      - "tests/conftest.py"
      - "tools/benchmark_conditional_sampling.py"
      - "tools/write_release_metadata.py"
      - "pyproject.toml"
      - "tools/run_in_workspace.py"
      - "setup.py"
  workflow_dispatch:
    inputs:
      layer:
        description: Conditional-sampling layer to run
        required: true
        type: choice
        default: all
        options:
          - all
          - pr-smoke
          - validation
          - external-high-dimensional
          - benchmark

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONFAULTHANDLER: "1"

concurrency:
  group: conditional-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-smoke:
    name: PR smoke
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.layer == 'all' || inputs.layer == 'pr-smoke'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies into a workspace venv
        run: python -B tools/run_in_workspace.py --github-venv
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run contracts and deterministic smoke cases
        run: >-
          python -m pytest -q tests/conditional
          --strict-markers
          -m "not validation and not benchmark and not external"
          --junitxml=build/conditional-sampling/pr-smoke.xml
      - name: Write runner metadata
        if: always()
        run: >-
          python tools/write_release_metadata.py
          --configuration conditional-pr-smoke
          --status "${{ job.status }}"
          --output build/conditional-sampling/pr-smoke-metadata.json
      - name: Upload PR smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conditional-pr-smoke
          path: build/conditional-sampling/*
          if-no-files-found: warn
          retention-days: 14

  validation:
    name: Distributional validation
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.layer == 'all' || inputs.layer == 'validation'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies into a workspace venv
        run: python -B tools/run_in_workspace.py --github-venv
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run analytical, dynamic, vine, and d=50 validation
        run: >-
          python -m pytest -q tests/conditional
          --strict-markers --run-validation
          -m "validation and not benchmark and not external"
          --junitxml=build/conditional-sampling/validation.xml
      - name: Write runner metadata
        if: always()
        run: >-
          python tools/write_release_metadata.py
          --configuration conditional-validation
          --status "${{ job.status }}"
          --output build/conditional-sampling/validation-metadata.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conditional-validation
          path: build/conditional-sampling/*
          if-no-files-found: warn
          retention-days: 21

  one-time-external-high-dimensional:
    name: One-time external and high-dimensional
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layer == 'all' || inputs.layer == 'external-high-dimensional')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies into a workspace venv
        run: python -B tools/run_in_workspace.py --github-venv
      - name: Install pinned external reference environment
        run: python -m pip install -e ".[test,external]"
      - name: Run external and d=50 conditional matrix
        run: >-
          python -m pytest -q tests/conditional
          --strict-markers --run-validation
          -m "(external or high_dimensional) and not benchmark"
          --junitxml=build/conditional-sampling/external-high-dimensional.xml
      - name: Write runner metadata
        if: always()
        run: >-
          python tools/write_release_metadata.py
          --configuration conditional-one-time-external-d50
          --status "${{ job.status }}"
          --output build/conditional-sampling/external-high-dimensional-metadata.json
      - name: Upload external and high-dimensional evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conditional-external-high-dimensional
          path: build/conditional-sampling/*
          if-no-files-found: warn
          retention-days: 30

  manual-benchmark:
    name: Manual measurement-only benchmark
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layer == 'all' || inputs.layer == 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYSCA_RUN_BENCHMARKS: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies into a workspace venv
        run: python -B tools/run_in_workspace.py --github-venv
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run benchmark contract cases
        run: >-
          python -m pytest -q
          tests/conditional/test_high_dimensional.py
          --strict-markers
          -m "benchmark and high_dimensional"
          --junitxml=build/conditional-sampling/benchmark-contracts.xml
      - name: Measure warmed conditional matrix
        run: >-
          python tools/benchmark_conditional_sampling.py
          --profile full --n-draws 1024 --mcmc-draws 8
          --repeats 5 --warmups 1 --n-threads 4 --include-mcmc
          --json-output build/conditional-sampling/benchmark.json
          --csv-output build/conditional-sampling/benchmark.csv
      - name: Write runner metadata
        if: always()
        run: >-
          python tools/write_release_metadata.py
          --configuration conditional-manual-benchmark
          --status "${{ job.status }}"
          --output build/conditional-sampling/benchmark-metadata.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conditional-benchmark
          path: build/conditional-sampling/*
          if-no-files-found: warn
          retention-days: 90
