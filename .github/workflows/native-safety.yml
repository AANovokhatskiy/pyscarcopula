name: Native safety

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/native-safety.yml"
      - "pyscarcopula/_cpp/**"
      - "pyscarcopula/_native/**"
      - "pyscarcopula/vine/**"
      - "pyscarcopula/numerical/**"
      - "pyscarcopula/strategy/gas.py"
      - "pyscarcopula/strategy/initial_point.py"
      - "pyscarcopula/stattests.py"
      - "pyscarcopula/strategy/scar_tm.py"
      - "pyscarcopula/strategy/scar_jacobi.py"
      - "tests/test_cpp.py"
      - "tests/test_cpp_architecture.py"
      - "tests/test_gate1_benchmarks.py"
      - "tests/test_cpp_gas_wrapper.py"
      - "tests/test_cpp_rvine_layer.py"
      - "tests/test_cpp_rvine_conditional.py"
      - "tests/test_cpp_rvine_density_mcmc.py"
      - "tests/test_cpp_rvine_rosenblatt.py"
      - "tests/test_cpp_dense_student_rosenblatt.py"
      - "tests/test_cpp_rvine_runtime.py"
      - "tests/test_rvine_runtime_contracts.py"
      - "tests/rvine_runtime_cases.py"
      - "tests/test_bivariate_gas_contract.py"
      - "tests/test_bivariate_gas_integration.py"
      - "tests/test_gas_backends.py"
      - "tests/test_fit.py"
      - "tests/test_tm_forward.py"
      - "tests/test_native_jacobi_*.py"
      - "tests/test_jacobi_*.py"
      - "tests/test_scar_jacobi_strategy.py"
      - "tests/test_multivariate_stochastic_student_corr.py"
      - "tests/test_vine_performance.py"
      - "setup.py"
      - "tools/check_cpp_architecture.py"
      - "tools/check_python_ownership.py"
      - "tools/python_ownership_policy.py"
      - "tools/run_gate1_benchmarks.py"
      - "benchmarks/gate1_manifest_v2.json"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/native-safety.yml"
      - "pyscarcopula/_cpp/**"
      - "pyscarcopula/_native/**"
      - "pyscarcopula/vine/**"
      - "pyscarcopula/numerical/**"
      - "pyscarcopula/strategy/gas.py"
      - "pyscarcopula/strategy/initial_point.py"
      - "pyscarcopula/stattests.py"
      - "pyscarcopula/strategy/scar_tm.py"
      - "pyscarcopula/strategy/scar_jacobi.py"
      - "tests/test_cpp.py"
      - "tests/test_cpp_architecture.py"
      - "tests/test_gate1_benchmarks.py"
      - "tests/test_cpp_gas_wrapper.py"
      - "tests/test_cpp_rvine_layer.py"
      - "tests/test_cpp_rvine_conditional.py"
      - "tests/test_cpp_rvine_density_mcmc.py"
      - "tests/test_cpp_rvine_rosenblatt.py"
      - "tests/test_cpp_dense_student_rosenblatt.py"
      - "tests/test_cpp_rvine_runtime.py"
      - "tests/test_rvine_runtime_contracts.py"
      - "tests/rvine_runtime_cases.py"
      - "tests/test_bivariate_gas_contract.py"
      - "tests/test_bivariate_gas_integration.py"
      - "tests/test_gas_backends.py"
      - "tests/test_fit.py"
      - "tests/test_tm_forward.py"
      - "tests/test_native_jacobi_*.py"
      - "tests/test_jacobi_*.py"
      - "tests/test_scar_jacobi_strategy.py"
      - "tests/test_multivariate_stochastic_student_corr.py"
      - "tests/test_vine_performance.py"
      - "setup.py"
      - "tools/check_cpp_architecture.py"
      - "tools/check_python_ownership.py"
      - "tools/python_ownership_policy.py"
      - "tools/run_gate1_benchmarks.py"
      - "benchmarks/gate1_manifest_v2.json"
      - "pyproject.toml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  asan-ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check C++ architecture
        run: |
          python tools/check_cpp_architecture.py
          python tools/check_python_ownership.py

      - name: Install sanitizer build
        env:
          PYSCA_CPP_SANITIZE: "1"
          PYSCA_CPP_STRICT: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run native safety tests
        env:
          ASAN_OPTIONS: >-
            detect_leaks=0:halt_on_error=1:abort_on_error=1:
            strict_string_checks=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          PYTHONFAULTHANDLER: "1"
        run: |
          asan_path="$(gcc -print-file-name=libasan.so)"
          libstdcpp_path="$(g++ -print-file-name=libstdc++.so.6)"
          export LD_PRELOAD="${asan_path}:${libstdcpp_path}"
          python -m pytest -vv -s --tb=long \
            tests/test_cpp_architecture.py \
            tests/test_gate1_benchmarks.py \
            tests/test_cpp.py \
            tests/test_cpp_gas_wrapper.py \
            tests/test_cpp_rvine_layer.py \
            tests/test_cpp_rvine_conditional.py \
            tests/test_cpp_rvine_density_mcmc.py \
            tests/test_cpp_rvine_rosenblatt.py \
            tests/test_cpp_dense_student_rosenblatt.py \
            tests/test_cpp_rvine_runtime.py \
            tests/test_rvine_runtime_contracts.py \
            tests/test_bivariate_gas_contract.py \
            tests/test_bivariate_gas_integration.py \
            tests/test_gas_backends.py \
            tests/test_tm_forward.py \
            tests/test_native_jacobi_domain.py \
            tests/test_native_jacobi_transition.py \
            tests/test_native_jacobi_evaluator.py \
            tests/test_native_jacobi_sampling.py \
            tests/test_native_jacobi_operations.py \
            tests/test_scar_jacobi_strategy.py \
            tests/test_fit.py \
            tests/test_multivariate_stochastic_student_corr.py \
            -m "not benchmark and not sanitizer_numerical"
