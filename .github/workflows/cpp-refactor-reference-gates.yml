name: C++ refactor reference gates

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      reference_label:
        description: Pinned Gate 1 hardware/toolchain configuration label
        required: true
        default: local-msvc-reference
        type: string
      baseline:
        description: Versioned Gate 1 baseline artifact in the repository
        required: true
        default: benchmark_artifacts/cpp_refactor_baseline.json
        type: string

permissions:
  contents: read

concurrency:
  group: cpp-refactor-reference-gates
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYSCA_CPP_BUILD_JOBS: "8"
  PYSCA_CPP_STRICT: "1"

jobs:
  gates-1-3:
    name: Gates 1-3 on pinned reference runner
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, cpp-refactor-reference]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify Stage 9 architecture and Python-free boundary
        run: |
          python tools/check_cpp_architecture.py
          python tools/build_cpp_tests.py --force -j 8

      - name: Gate 2 accuracy contracts
        run: |
          python tools/capture_cpp_refactor_goldens.py --check
          python -m pytest -n 8 -q tests/test_cpp_refactor_contracts.py

      - name: Gate 3 config-preservation contracts
        run: python tools/write_cpp_refactor_inventory.py --check

      - name: Gate 1 paired performance comparison
        run: >-
          python tools/benchmark_cpp_refactor.py
          --compare-to "${{ inputs.baseline || 'benchmark_artifacts/cpp_refactor_baseline.json' }}"
          --reference-label "${{ inputs.reference_label || 'local-msvc-reference' }}"
          --output benchmark_artifacts/cpp_refactor_reference_candidate.json
          --summary benchmark_artifacts/cpp_refactor_reference_candidate.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-refactor-reference-gates
          path: |
            benchmark_artifacts/cpp_refactor_reference_candidate.json
            benchmark_artifacts/cpp_refactor_reference_candidate.md
