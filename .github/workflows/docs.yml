name: Validate and deploy docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyscarcopula/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'tests/test_documentation*.py'
      - 'tests/fixtures/documentation_anchors.json'
      - 'tools/check_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyscarcopula/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'tests/test_documentation*.py'
      - 'tests/fixtures/documentation_anchors.json'
      - 'tools/check_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,docs]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_documentation_contracts.py tests/test_documentation_rendering.py
      - run: python -m mkdocs build --strict
      - run: python tools/check_docs.py --site-dir site --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-validation
          path: build/docs-check
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: python -m mkdocs gh-deploy --strict --force
