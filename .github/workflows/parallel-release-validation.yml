          python tools/write_release_metadata.py
          --source-root "${{ github.workspace }}"
          --configuration subinterpreter-rejection
          --wheel-dir "${{ env.RELEASE_ARTIFACT_ROOT }}/wheelhouse"
          --validation-file
          "${{ env.RELEASE_ARTIFACT_ROOT }}/wheel_validation.json"
          --test-workers 4 --build-jobs 4
          --output "${{ env.RELEASE_ARTIFACT_ROOT }}/provenance.json"
      - name: Finalize append-only subinterpreter evidence
        run: >-
          python tools/finalize_release_artifacts.py
          --source-root "${{ github.workspace }}"
          --artifact-root "${{ env.RELEASE_ARTIFACT_ROOT }}"
          --producer "Release validation subinterpreter rejection"
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-validation-subinterpreters
          path: ${{ env.RELEASE_ARTIFACT_ROOT }}
          if-no-files-found: error

  report:
    name: Aggregate validation report
    if: always()
    needs:
      - platform
      - asan-ubsan
      - tsan
      - unix-lifecycle-memory
      - subinterpreters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - name: Initialize report path
        env:
          RELEASE_REPORT_ROOT: ${{ github.workspace }}/build/ci/parallel-release-validation
        run: echo "RELEASE_REPORT_ROOT=$RELEASE_REPORT_ROOT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: parallel-validation-*
          path: ${{ github.workspace }}/build/ci/release-artifacts
      - name: Reject incomplete validation matrix
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          ASAN_RESULT: ${{ needs['asan-ubsan'].result }}
          TSAN_RESULT: ${{ needs.tsan.result }}
          LIFECYCLE_RESULT: ${{ needs['unix-lifecycle-memory'].result }}
          SUBINTERPRETER_RESULT: ${{ needs.subinterpreters.result }}
        run: |
          python - <<'PY'
          import os
          results = {
              name: os.environ[name]
              for name in (
                  "PLATFORM_RESULT",
                  "ASAN_RESULT",
                  "TSAN_RESULT",
                  "LIFECYCLE_RESULT",
                  "SUBINTERPRETER_RESULT",
              )
          }
          print(results)
          if set(results.values()) != {"success"}:
              raise SystemExit("release-validation matrix is incomplete or failed")
          PY
      - name: Aggregate reports
        run: >-
          python tools/aggregate_release_validation.py
          --source-root "${{ github.workspace }}"
          --artifacts "${{ github.workspace }}/build/ci/release-artifacts"
          --json-output "${{ env.RELEASE_REPORT_ROOT }}/platform_matrix.json"
          --markdown-output "${{ env.RELEASE_REPORT_ROOT }}/platform_matrix.md"
          --required-configuration linux-gcc-py310
          --required-configuration linux-gcc-py314
          --required-configuration linux-clang-py312
          --required-configuration windows-msvc-py312
          --required-configuration windows-mingw64-py312
          --required-configuration macos-arm64-clang-py312
          --required-configuration linux-clang-asan-ubsan
          --required-configuration linux-gcc-tsan
          --required-configuration linux-lifecycle-memory
          --required-configuration subinterpreter-rejection
      - name: Finalize aggregated release evidence
        run: >-
          python tools/finalize_release_artifacts.py
          --source-root "${{ github.workspace }}"
          --artifact-root "${{ env.RELEASE_REPORT_ROOT }}"
          --producer "Release validation compiler and sanitizer matrix"
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-release-validation
          path: ${{ env.RELEASE_REPORT_ROOT }}
          if-no-files-found: error
