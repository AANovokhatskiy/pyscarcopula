      - working-directory: ${{ github.workspace }}/build/ci
        env:
          PYSCA_RELEASE_METRICS_OUTPUT: ${{ env.RELEASE_ARTIFACT_ROOT }}/metrics.json
        run: |
          python -m pytest --import-mode=importlib -p no:cacheprovider \
