name: Equicorr scaling benchmark

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  equicorr-scaling:
    name: Equicorr preparation scaling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Enforce equicorrelation CPU scaling target
        env:
          PYSCA_RUN_BENCHMARKS: "1"
          PYSCA_RUN_LARGE_BENCHMARKS: "1"
          PYSCA_ENFORCE_PERFORMANCE_GATES: "1"
          PYSCA_EQUICORR_BENCHMARK_OUTPUT: ${{ github.workspace }}/build/release/equicorr-scaling-metrics.json
        run: >-
          python -m pytest -vv -s
          tests/test_equicorr_prepared_performance.py
          -m benchmark
      - name: Write equicorrelation scaling metadata
        run: >-
          python tools/write_release_metadata.py
          --configuration linux-equicorr-preparation-scaling
          --output build/release/linux-equicorr-preparation-scaling.json
      - uses: actions/upload-artifact@v7
        with:
          name: equicorr-preparation-scaling
          path: build/release/*.json
