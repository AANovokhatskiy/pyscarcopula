name: typing

on:
  push:
  pull_request:

jobs:
  static-model-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep build and test files in the workspace
        run: python -B tools/run_in_workspace.py --github-env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies into a workspace venv
        run: python -B tools/run_in_workspace.py --github-venv
      - run: python -m pip install -e ".[test]"
      - run: python -m mypy tests/typecheck/static_models.py
