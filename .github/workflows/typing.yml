name: typing

on:
  push:
  pull_request:

jobs:
  static-model-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - run: python -m mypy tests/typecheck/static_models.py
