[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscarcopula"
version = "0.21.0"
description = "Python library for bivariate, multivariate, vine, and stochastic copula models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Alexey Novokhatskiy", email = "aanovokhatskiy@gmail.com"},
]
keywords = [
    "copula", "python", "copula python", "stochastic", "SCAR",
    "vine copula", "bivariate copula", "multivariate copula",
    "transfer matrix", "risk management", "VaR", "CVaR",
    "time-varying dependence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.56",
    "scipy>=1.9",
    "joblib>=1.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.5",
    "pandas>=1.5",
    "mypy>=1.10",
    "tomli>=1.1.0; python_version < '3.11'",
]
external = ["pyvinecopulib==0.7.5"]
examples = ["pandas>=1.5", "matplotlib", "jupyter"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/AANovokhatskiy/pyscarcopula"
Repository = "https://github.com/AANovokhatskiy/pyscarcopula"
Issues = "https://github.com/AANovokhatskiy/pyscarcopula/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pyscarcopula = ["py.typed"]

[tool.setuptools.packages.find]
include = ["pyscarcopula*"]
exclude = ["tests*", "data*", "pyscarcopula._cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep tests from the same module on one worker.  This preserves module-local
# runtime and filesystem assumptions while allowing independent modules to run
# concurrently when the caller explicitly supplies ``-n N``.  Without ``-n``
# pytest remains strictly sequential.
addopts = "--dist=loadscope"
markers = [
    "data: tests requiring data/ directory (csv files)",
    "benchmark: optional performance regression checks",
    "sanitizer_numerical: exact floating-point golden checks excluded from sanitizer builds",
    "tsan_incompatible: fork-after-threads checks unsupported by ThreadSanitizer",
    "validation: optional distributional validation checks",
    "external: optional checks against external reference libraries",
    "high_dimensional: d=50 conditional-sampling validation and benchmark cases",
    "rvine_native: tests that require native R-vine runtime entry points",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyscarcopula", "pyscarcopula.*"]
ignore_errors = true
